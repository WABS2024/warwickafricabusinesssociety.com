<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" href="assets/images/wabs.jpeg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }


        .contact-hero {
            position: relative;
            height: 100%;
            min-height: 420px;
            align-items: center;
            padding: 7rem 9rem;
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.9)),  url("assets/images/african-businesses.jpg") top/cover;
            color: var(--wabs-white);
        }

        .contact-hero-content {
            position: absolute;
            top: 50%;
            width: 100%;
            z-index: 1;
            width: min(100%, 720px);
            border: 1px solid white;
            animation: hero-in 800ms cubic-bezier(.2,.8,.2,1) both;
        }

        .hero-text {
            color: #fff;
            text-align: left;
            position: absolute;
            top: 50%;
            left: 8%;
            /* transform: translate(-50%, -50%); */
        }

        .content-section {
            display: flex;
            gap: 40px;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }


        .left-content {
            flex: 1;
            padding: 20px;
        }

        .left-content h2, .left-content p{
            color: #fff;
        }

        .left-content p{
            margin-top: 10px;
        }

        .contact-info{
            margin-top: 35px;
        }

        .contact-info p {
            color: rgba(252, 250, 250, 0.7);
        }

        .right-content {
            flex: 1;
            padding: 20px;
        }

        form {
            background: #1a1a1a; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            max-width: 100%;
            padding: 30px;
            
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.05);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #fff;
            font-weight: 300;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
        }

        form p{
            margin-top: 10px;
            font-weight: 200;
        }

        form button {
            background-color: transparent;
            color: #fff;
            border: 1px solid #fff;
            border-radius: 30px;
            padding: 12px 24px;
            font-family: inherit;
            font-weight: 200;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        form button:hover {
            background-color: #e5c35b;
            color: #000;
            border: none;
            font-weight: 300;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        @media (max-width: 768px) {

            .content-section {
                flex-direction: column;
                padding: 20px 10px;
            }

            .hero-text {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .hero-text {
                font-size: 1.5rem;
            }

            .content-section {
                padding: 10px;
            }

            .left-content, .right-content {
                padding: 10px;
            }

            footer img {
                height: 28px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="assets/images/wabs-removebg-preview.png" alt="WABS Logo">
        </a>

        <button type="button" class="hamburger" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="report.html">Reports</a></li>
                <li><a href="events_info.html">Events</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-hero">
            <h2 class="large-text hero-text">Contact Us</h2>
        </section>

        <section class="content-section">
            <div class="left-content">
                <h2 class="medium-text">Get in Touch</h2>
                <p class="small-text">Reach out to us via email</p>
                <div class="contact-info">
                    <p><strong class="small-text">Warwick African Business Society:</strong><br></p>
                    <p><strong class="small-text">Warwick Business School,</strong><br></p>
                    <p class="small-text">Scarman Rd,</p>
                    <p class="small-text">Coventry,</p>
                    <p class="small-text">CV4 7AL</p>
                </div>
            </div>

            <div class="right-content">
                <form id="contactForm">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="4" placeholder="Your message" required></textarea>

                    <p>* Indicates required field</p>
                    <button type="submit">Send your enquiry</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <a href="https://www.instagram.com/warwickafricanbusinesssoc/">
            <img src="assets/images/ig_logo.png" alt="Instagram">
        </a>
        <a href="https://www.linkedin.com/company/warwick-african-business-society/?viewAsMember=true">
            <img src="assets/images/linkedin_logo.png" alt="LinkedIn">
        </a>
        <p>warwickafricanbusinesssociety@gmail.com</p>
        <p>&copy; 2024 by WABS Group</p>
    </footer>

    <script src="assets/js/site.js"></script>
</body>
</html>
